<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Gallery - Madeleine Sauvage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fixed Top Navigation Bar -->
  <nav class="top-nav projects-page-nav">
    <a href="index.html">ABOUT</a>
    <a href="projects.html">PROJECTS</a>
    <a href="contact.html">CONTACT</a>
    <a href="gallery.html" class="active">GALLERY</a>
  </nav>

  <!-- Full-Width Canvas for Scattered Images -->
  <main class="scatter-gallery-container">
    <div id="scatter-board" class="scatter-board"></div>
  </main>

<script>
    const images = [
      {src: 'assets/knitting/twin.png', tag: 'lynch <3' },
      { src: 'assets/knitting/diagonal.png', tag: 'funky' },
      { src: 'assets/knitting/top.png', tag: 'freehand top' },
      { src: 'assets/knitting/stripe.jpeg', tag: 'sicily slipover' },
      { src: 'assets/knitting/bag.png', tag: 'scrap patch bag' },
      { src: 'assets/knitting/vest.png', tag: 'a vest to be' },
      { src: 'assets/knitting/rat.png', tag: 'for rat boy' },
      { src: 'assets/knitting/honey.png', tag: 'honeycomb cable knit (i messed this up)' },
      { src: 'assets/knitting/foreverback.jpeg', tag: 'hehehe yk this one' },
      { src: 'assets/knitting/kermit.png', tag: 'crochet tapestry' },
      { src: 'assets/knitting/apple.jpeg', tag: 'apple scrunchie' },
      { src: 'assets/knitting/IMG_0151.png', tag: 'hungry caterpillar cardi' },
      { src: 'assets/knitting/dream.png', tag: 'kafka' },
      { src: 'assets/knitting/polo.png', tag: 'stripe polo' },
      { src: 'assets/knitting/house.png', tag: 'little house' },
      {src: 'assets/knitting/tshirt.png', tag: 'little tee' },
      {src: 'assets/knitting/poncho.png', tag: 'lace poncho' },
      { src: 'assets/knitting/tweed.png', tag: 'tweeeeeed' },
      { src: 'assets/knitting/ladybird.jpeg', tag: 'ladybird' },
      { src: 'assets/knitting/buckle.png', tag: 'pink!!!!!!!!!!!!' },
      { src: 'assets/knitting/sicilyforever.jpeg', tag: 'sicily slipover x adrianne lenker' },
      { src: 'assets/knitting/IMG_0973.png', tag: 'cable knit' },
      { src: 'assets/knitting/socks.jpeg', tag: 'not sure if i ever finished that sock' },
      { src: 'assets/knitting/hannifront.jpeg', tag: 'hanni cardi' },
      { src: 'assets/knitting/whatif.png', tag: 'what if? do you have an answer for me?' },
      { src: 'assets/knitting/stripejumper.png', tag: 'crochet striped pullover' },
      { src: 'assets/knitting/cloud.png', tag: 'the start of the cloud sweater' },
      { src: 'assets/knitting/stripevest.png', tag: 'freehand vest (can you tell i like stripes?)' },
    ];

    const board = document.getElementById('scatter-board');
    
    // Size settings
    const imgSize = 200; 
    const padding = 20; // Clearance buffer between images
    const cellSize = imgSize + padding;

    // Viewport width and grid columns
    const fullWidth = window.innerWidth;
    const cols = Math.max(1, Math.floor(fullWidth / cellSize));
    const totalRows = Math.ceil(images.length / cols);

    // Calculate remaining empty space on the screen and split it evenly on left and right
    const totalGridWidth = cols * cellSize;
    const sideMargin = Math.max(5, (fullWidth - totalGridWidth) / 2);

    // Set board height
    board.style.width = '100vw';
    board.style.height = `${(totalRows * cellSize) + 200}px`;

    // CHANGED: Rename loop parameter from `src` to `item`
    images.forEach((item, index) => {
      const col = index % cols;
      const row = Math.floor(index / cols);

      const img = document.createElement('img');
      img.src = item.src;        // FIXED: Access item.src path
      img.alt = item.tag;        // Added alt attribute for accessibility
      img.title = item.tag;      // FIXED: Display the custom tag on hover
      img.className = 'scatter-item';

      // Random position jitter inside its cell zone
      const leftOffset = Math.floor(Math.random() * (cellSize - imgSize));
      const topOffset = Math.floor(Math.random() * (cellSize - imgSize));

      // Add sideMargin so the grid starts balanced across the screen
      const posX = sideMargin + (col * cellSize) + leftOffset;
      const posY = (row * cellSize) + topOffset + 130; 

      // Random rotation (-15deg to +15deg)
      const rotation = Math.floor(Math.random() * 30) - 15;

      img.style.left = `${posX}px`;
      img.style.top = `${posY}px`;
      img.style.transform = `rotate(${rotation}deg)`;

      board.appendChild(img);
    });
  </script>

</body>
</html>
